name: semgrep-sast
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep
      - run: semgrep scan --config php-sast-rules.yml --sarif -o semgrep.sarif bWAPP/app
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
